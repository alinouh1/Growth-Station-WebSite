<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Growth Station — Strategic growth partner for ambitious businesses across Egypt & the GCC." />
    <title>Growth Station</title>
    <link rel="icon" type="image/png" href="/images/logo2.png" />

    <!-- ✅ تغيير 1: connection مبكر لسيرفرات جوجل (كانوا موجودين، سيبناهم) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      ✅ تغيير 2: كان عندك 3 ملفات CSS للخطوط، كل واحد render-blocking (المتصفح مش بيرسم حاجة لحد ما ينزلهم).
      دمجتهم في request واحد، وحمّلتهم بطريقة non-blocking (preload ثم تحويله لـ stylesheet)
      عشان الصفحة تترسم فورًا بخط بديل، وبعدين الخط الحقيقي يتبدّل (display=swap).
      لو لقيت الـ CLS زاد في PageSpeed، ارجع لـ <link rel="stylesheet"> عادي بنفس الـ URL.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@500;600;700;800&display=swap"
      />
    </noscript>

    <!--
      ✅ تغيير 3: preload لصورة الـ Hero (هي أكبر عنصر = الـ LCP).
      لازم الـ href والـ media يطابقوا بالظبط اللي في <picture> جوه Hero.jsx،
      وإلا المتصفح هينزّل الصورة مرتين. بقت WebP بدل JPG.
    -->
    <link rel="preload" as="image" href="/images/background-mobile.webp" type="image/webp" media="(max-width: 639px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/back.webp" type="image/webp" media="(min-width: 640px)" fetchpriority="high" />

    <style>
      /* Critical CSS for above-the-fold content */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Cairo', sans-serif;
        background-color: #f5f5f0;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
